# bimmer-drive: while "Đưa màn giữa lên đồng hồ" is enabled in Camera & VietMap,
# /run/bimmer-drive/woc.env sets WOC_SRC_CROP="-s avb_stream= -s src_crop=<crop>".
# When off or after any reboot (/run is tmpfs), the file is absent and waze-on-cluster runs untouched.
[Service]
EnvironmentFile=-/run/bimmer-drive/woc.env
